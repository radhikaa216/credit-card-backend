services:

  mysql:
    image: mysql:8.4
    container_name: creditcard_mysql

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10


  django:
    build:
      context: ./django_backend

    container_name: creditcard_django

    environment:
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_HOST: mysql
      DB_PORT: 3306

    ports:
      - "8000:8000"

    depends_on:
      mysql:
        condition: service_healthy


  fastapi:
    build:
      context: ./fastapi_backend

    container_name: creditcard_fastapi

    environment:
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_HOST: mysql
      DB_PORT: 3306
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}

    ports:
      - "8001:8001"

    depends_on:
      mysql:
        condition: service_healthy


volumes:
  mysql_data: